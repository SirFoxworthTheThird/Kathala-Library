# Keep authoring originals, visual QA and dependencies out of the deploy.
# The staged root still contains library/, preserving every existing URL.
[build]
  publish = ".netlify-publish"
  command = "node scripts/stage-site.mjs"

# Everything the app asks for remains under /library/.
[[headers]]
  for = "/library/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
