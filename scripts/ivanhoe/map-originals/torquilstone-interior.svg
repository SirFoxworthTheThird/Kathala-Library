<text x="1600" y="1210" font-size="23">Downward: deep dungeon</text><text x="1600" y="1280" font-size="23">Upward: isolated turret</text><path d="M65 1460H2235" stroke="#b9a57e"/><text x="65" y="1498" font-size="16">Each panel is a separate narrated place. Floor numbers, exact room connections and most dimensions are not supplied; blank gaps between panels are not corridors.</text><text x="65" y="1526" font-size="16">The old hall faces the court. The corner-room lattice is raised by two or three steps; its viewer remains in the room. The armoury balcony is a different viewpoint.</text><text x="65" y="1554" font-size="16">The dungeon lies below moat level; the isolated turret is reached by steep stairs. Furniture positions, pillar counts and room shapes are illustrative reconstruction; no invented escape doors.</text></g></svg>