<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1600" viewBox="0 0 2300 1600"><defs><g id="tree"><circle r="30" fill="#82945f"/><circle cx="-15" cy="-12" r="23" fill="#a2af77"/><path d="M0 7v27m0-17-15-14m15 14L15 0" stroke="#626c48" stroke-width="4"/></g><pattern id="stone" width="55" height="30" patternUnits="userSpaceOnUse"><rect width="55" height="30" fill="#b3ac96"/><path d="M0 0h55v30H0Zm27 0v30" fill="none" stroke="#8e8875" stroke-width="2"/></pattern></defs><rect width="2300" height="1600" fill="#eee3cb"/><g font-family="Georgia,serif" fill="#382f25"><text x="65" y="65" font-size="35">Torquilstone · distinct rooms and passages</text><text x="65" y="105" font-size="18">XXI–XXXI · separate room details, not a measured composite footprint</text><g><rect x="70" y="180" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="100" y="224" font-size="27">The old hall</text><text x="100" y="434" font-size="20">Heavy Saxon pillars; windows toward the court</text></g><g><rect x="810" y="180" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="840" y="224" font-size="27">The new hall</text><text x="840" y="434" font-size="20">Lighter pillars and a vaulted roof</text></g><g><rect x="1550" y="180" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="1580" y="224" font-size="27">Reception apartment</text><text x="1580" y="434" font-size="20">Exact room shape and furnishings unspecified</text></g><g><rect x="70" y="490" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="100" y="534" font-size="27">Furnished chamber</text><text x="100" y="744" font-size="20">Faded and damaged tapestry</text></g><g><rect x="810" y="490" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="840" y="534" font-size="27">Low arched passage</text><text x="840" y="744" font-size="20">A confined internal route</text></g><g><rect x="1550" y="490" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="1580" y="534" font-size="27">Corner chamber</text><text x="1580" y="744" font-size="20">Raised lattice within the room</text></g><g><rect x="70" y="800" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="100" y="844" font-size="27">Small private apartment</text><text x="100" y="1054" font-size="20">Table and cupboard; private doorway</text></g><g><rect x="810" y="800" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="840" y="844" font-size="27">Postern passage</text><text x="840" y="1054" font-size="20">Route toward the secondary exit</text></g><g><rect x="1550" y="800" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="1580" y="844" font-size="27">Armoury and balcony</text><text x="1580" y="1054" font-size="20">Lattice opens onto a projecting viewpoint</text></g><g><rect x="70" y="1110" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="100" y="1154" font-size="27">Bedchamber</text><text x="100" y="1364" font-size="20">A room containing a bed</text></g><g><rect x="810" y="1110" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="840" y="1154" font-size="27">Vaulted entrance</text><text x="840" y="1364" font-size="20">Passage just within the postern</text></g><g><rect x="1550" y="1110" width="680" height="280" fill="#c8b899" stroke="#7e6b50" stroke-width="10"/><text x="1580" y="1154" font-size="27">Vertical room-detail index</text><text x="1580" y="1364" font-size="20">Positions and floor numbers are unstated</text></g><circle cx="230" cy="285" r="19" fill="url(#stone)" stroke="#877861" stroke-width="4"/><circle cx="230" cy="355" r="19" fill="url(#stone)" stroke="#877861" stroke-width="4"/><circle cx="440" cy="285" r="19" fill="url(#stone)" stroke="#877861" stroke-width="4"/><circle cx="440" cy="355