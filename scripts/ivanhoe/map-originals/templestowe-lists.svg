<path d="M130 260v-60m-10 18 10-18 10 18" fill="none" stroke="#625b45" stroke-width="3"/><text x="120" y="188" font-size="19">N</text><path d="M65 1160H1735" stroke="#b9a57e"/><text x="65" y="1198" font-size="16">The tribunal is at the east; the prepared stake and unlit fuel are at the opposite end.</text><text x="65" y="1226" font-size="16">The enclosure adjoins the Preceptory on a gentle eminence. Its shape, proportions, entrance side, seating extent and exact measurements are not supplied.</text><text x="65" y="1254" font-size="16">Gallery, bench and tribunal details are schematic reconstruction. East/west relations follow the source; drawn distances are not a measured combat scale.</text></g></svg>