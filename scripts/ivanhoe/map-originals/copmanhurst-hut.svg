<text x="255" y="605" font-size="19">One room for shelter, meals and repose</text><path d="M65 755H1335" stroke="#bca77d"/><text x="65" y="790" font-size="16">A single multifunctional room. The source supplies no exact dimensions, cardinal orientation or furniture positions.</text><text x="65" y="818" font-size="16">Room shape, door swing, floor texture, hearth and furniture placement are interpretive. The hut leans against the rock.</text><text x="65" y="846" font-size="16">Initial visible furnishings only. No separate stable, guest bedroom or connecting passage is established by the source.</text></g></svg>