<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect width="1600" height="1200" fill="#eee3cc"/><g font-family="Georgia,serif" fill="#392f25"><text x="65" y="65" font-size="34">Saint Botolph’s · house, gate and woodland</text><text x="65" y="105" font-size="19">XL.3–31 · a small religious house and the departure below its stair</text><rect x="70" y="155" width="1460" height="840" rx="25" fill="#c5cf9e"/><path d="M100 850Q410 700 770 870T1510 820M110 890Q500 780 820 920T1500 870" fill="none" stroke="#a4b17f" stroke-width="4"/><path d="M700 870Q850 960 1380 960" fill="none" stroke="#b6a583" stroke-width="45"/><rect x="220" y="270" width="730" height="390" fill="#c3b496" stroke="#7d6d52" stroke-width="12"/><rect x="290" y="330" width="590" height="255" fill="#d4c5a6" stroke="#b4a17d" stroke-width="3" stroke-dasharray="10 7"/><text x="585" y="430" text-anchor="middle" font-size="27">Within the Priory</text><text x="585" y="470" text-anchor="middle" font-size="19">Exact conference room unknown</text><path d="M620 660h130v180H620Zm0 30h130m-130 30h130m-130 30h130m-130 30h130m-130 30h130" fill="#af9770" stroke="#7d6d52" stroke-width="4"/><text x="360" y="745" font-size="23">Stair down</text><path d="M620 865h130" stroke="#795d3b" stroke-width="13"/><text x="540" y="920" font-size="23">Gate and mounting place</text><rect x="1040" y="265" width="400" height="390" rx="12" fill="#ded0b3" stroke="#ac9775" stroke-width="3" stroke-dasharray="10 7"/><text x="1240" y="310" text-anchor="middle" font-size="18">Separate room detail · position unknown</text><rect x="1090" y="355" width="300" height="245" fill="#c6b798" stroke="#7d6d52" stroke-width="9"/><rect x="1165" y="420" width="150" height="80" fill="#9f8159" stroke="#795d3b" stroke-width="4"/><text x="1240" y="560" text-anchor="middle" font-size="25">Refectory</text><text x="1050" y="750" font-size="24">Surrounding forest</text><circle cx="170" cy="210" r="35" fill="#8e9f69"/><circle cx="162" cy="200" r="23" fill="#a5b782"/><circle cx="1450" cy="200" r="35" fill="#8e9f69"/><circle cx="1442" cy="190" r="23" fill="#a5b782"/><circle cx="1350" cy="800" r="35" fill="#8e9f69"/><circle cx="1342" cy="790" r="23" fill="#a5b782"/><circle cx="220" cy="930" r="35" fill="#8e9f69"/><circle cx="212" cy="920" r="23" fill="#a5b782"/><circle cx="1500" cy="600" r="35" fill="#8e9f69"/><circle cx="1492" cy="590" r="23" fill="#a5b782"/><circle cx="1100" cy="890" r="35" fill="#8e9f69"/><circle cx="1092" cy="880" r="23" fill="#a5b782"/><path d="M65 1030h1470" stroke="#b8a17b"/><text x="65" y="1070" font-size="16">The small Priory stands near the woodland. The gate lies below a stair descended by the departing guest; the refectory is separately named.</text><text x="65" y="1100" font-size="16">Footprint, orientation, vegetation and building positions are reconstructed. The earlier conference room and its floor are not established.</text><text x="65" y="1130" font-size="16">The refectory is an unlocated room detail: no invented corridor, direct doorway or surveyed distance connects it to the departure stair.</text></g></svg>