<text x="320" y="730" font-size="21">Floor and position within the house unknown</text><path d="M65 850H1335" stroke="#b8a17b"/><text x="65" y="890" font-size="16">Cushions, the couch curtain and tapestry-hidden doorway follow the room description. No exact dimensions or compass direction are supplied.</text><text x="65" y="918" font-size="16">Furniture and entrance positions are reconstructed. This room is not silently identified with Isaac’s earlier upper apartment.</text><text x="65" y="946" font-size="16">The parent-map detail index provides navigation only; it is not a claimed corridor or route between floors.</text></g></svg>