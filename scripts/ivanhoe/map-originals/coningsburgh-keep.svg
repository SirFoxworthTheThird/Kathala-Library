<path d="M350 420q-80 90-20 160" fill="none" stroke="#816d4e" stroke-width="14"/><text x="100" y="350" font-size="20">Buttress stair to fourth storey</text><path d="M65 1195H1685" stroke="#b8a17b"/><text x="65" y="1235" font-size="16">The southern portal and wall stair lead to the third-storey round room. Two dark vault storeys lie below its square floor opening.</text><text x="65" y="1265" font-size="16">The chapel occupies a buttress; its adjoining oratory is reached by a few steps and has a western loophole. Detail panels do not fix a buttress.</text><text x="65" y="1295" font-size="16">Wall thickness, room geometry, table and stair positions are schematic. The chapel’s exact buttress and compass orientation are unstated.</text></g></svg>