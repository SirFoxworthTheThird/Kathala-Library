<text x="25" y="650" font-size="17">Separate woodland sequence; not a surveyed continuation.</text></g><path d="M65 1640h2070" stroke="#b8a17b"/><text x="65" y="1680" font-size="19">Hill, brook, thicket, junction and relative route features follow the narrated passages. Contours indicate qualitative relief only.</text><text x="65" y="1715" font-size="19">Panel spacing, vegetation, path geometry and distances are reconstructed. Separate panels are not geographic neighbours; no north arrow or metric scale is claimed.</text><text x="65" y="1750" font-size="19">The regional map provides the Don-country context between Sheffield and Doncaster. Unstated connecting routes remain unstated.</text></g></svg>