<path d="M1440 1030q100-25 250 20" fill="none" stroke="#af9b74" stroke-width="15"/><text x="1430" y="1090" font-size="18">Path beside the gathering</text><path d="M65 1260H1735" stroke="#b9a57e"/><text x="65" y="1298" font-size="16">Main-gate barbican and drawbridge are distinct from the fortified postern outwork and its moat crossing. Dashed alignments do not assert an open crossing.</text><text x="65" y="1326" font-size="16">Keep, buildings, walls and moat are ground-plan outlines. Their current condition belongs to the scene; outlines do not assert intact roofs or passable routes.</text><text x="65" y="1354" font-size="16">Dimensions, exact footprint, slopes, watercourse bends and all positions except stated east/west relations are reconstructed. No measured travel scale is assigned.</text></g></svg>