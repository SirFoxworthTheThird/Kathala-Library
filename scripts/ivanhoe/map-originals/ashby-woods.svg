<text x="110" y="195" font-size="17">Relative terrain · no compass or measured scale</text><path d="M65 895H1435" stroke="#b9a57e"/><text x="65" y="935" font-size="16">The opening lies beyond the lane’s left-hand bank, within the thicket between the lane and common. The heath rises to a view of the lists.</text><text x="65" y="963" font-size="16">Relief strokes show relative slopes only. Shape, extent, path bends, vegetation and orientation are reconstructed; no surveyed heights are claimed.</text><text x="65" y="991" font-size="16">Dashed paths indicate interpretive connections between narrated places. The avenue’s exact connection and the road back to the pavilions are unstated.</text></g></svg>