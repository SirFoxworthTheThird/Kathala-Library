<text x="115" y="210" font-size="24">Don-side mount</text><path d="M65 1295H1735" stroke="#b8a17b"/><text x="65" y="1335" font-size="16">Scott describes the story-time outer enclosure as a rude palisade, unlike the later fortifications seen by his contemporary visitor.</text><text x="65" y="1365" font-size="16">Keep and six buttresses are source-established. Mount contours, river bend, court outline, food stations and distances are reconstructed.</text><text x="65" y="1395" font-size="16">No later outer stone curtain is imported. The drawing represents the novel’s architecture, not a modern measured archaeological survey.</text></g></svg>