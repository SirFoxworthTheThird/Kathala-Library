<text x="790" y="860" font-size="23">Private stair down</text><text x="790" y="900" font-size="20">To the long gallery and great hall</text><path d="M65 1060H1585" stroke="#b9a57e"/><text x="65" y="1098" font-size="16">A private stair serves the remote confinement and descends to the long gallery. An adjoining chamber lies near the cell.</text><text x="65" y="1126" font-size="16">These are separate room details. Adjacency does not establish a particular connecting doorway or corridor; no such route is drawn.</text><text x="65" y="1154" font-size="16">Room shapes, dimensions, doorway side and stair placement are reconstructed. The upper/lower relationship is known; absolute storey numbers are not.</text></g></svg>