<text x="110" y="865" font-size="20">Lattice opening and parapet above the court</text><path d="M65 940H1385" stroke="#b9a57e"/><text x="65" y="978" font-size="16">The chamber is reached by a steep stair. The bartisan detail shows the parapet outside its lattice, above the court.</text><text x="65" y="1006" font-size="16">Cell and bartisan shapes, stair direction, door/window sides and all proportions are reconstructed. No floor number or measured height is claimed.</text><text x="65" y="1034" font-size="16">Cell, lattice and parapet are separate positions within the raised chamber and its exterior bartisan.</text></g></svg>