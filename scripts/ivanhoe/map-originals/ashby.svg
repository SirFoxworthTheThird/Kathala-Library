<text x="830" y="199" font-size="20">Destinations in and near Ashby</text><text x="830" y="230" font-size="17">Castle and country lodging: exact relative</text><text x="830" y="257" font-size="17">positions in the vicinity are not supplied.</text><path d="M65 770H1335" stroke="#bea780"/><text x="65" y="805" font-size="16">The wood approaches within a mile of Ashby; a sloping meadow lies on its verge. The field and town are connected by the crowd’s route.</text><text x="65" y="832" font-size="16">Compass direction, route bends, building positions, vegetation extent and relief strokes are reconstructed; this is not a surveyed town plan.</text><text x="65" y="859" font-size="16">The destination index is non-geographic. Castle detail must follow the narrative rather than the later Hastings ruins.</text></g></svg>