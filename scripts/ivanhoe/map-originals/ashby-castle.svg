<text x="930" y="780" font-size="18">No connecting corridor or door is asserted.</text><text x="930" y="810" font-size="18">These panels are room details, not one footprint.</text><path d="M65 895H1435" stroke="#b9a57e"/><text x="65" y="935" font-size="16">The banquet room, inner hall and interior apartment are distinct narrated spaces. Their floor assignments, dimensions and exact connections are unstated.</text><text x="65" y="963" font-size="16">Room shapes, table placement, seating, decoration and orientation are illustrative reconstruction; this is not a measured historic plan.</text><text x="65" y="991" font-size="16">The room-detail panels provide navigation without identifying the inner hall with the banquet hall or placing an unseen speaker in the listener’s room.</text></g></svg>