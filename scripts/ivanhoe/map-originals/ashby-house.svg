<text x="1180" y="310" font-size="17">Room-detail index</text><text x="1180" y="345" font-size="15">Position and floor</text><text x="1180" y="371" font-size="15">not established</text><path d="M65 850H1335" stroke="#b8a17b"/><text x="65" y="890" font-size="16">Lower level: a dark entrance hall, an adjoining apartment, a paved court, and an entrance gate with a wicket.</text><text x="65" y="918" font-size="16">Building shape, room sizes, orientation, stair position and court placement are reconstructed. This is not a surveyed town house.</text><text x="65" y="946" font-size="16">The detail index does not assign an unknown room to this floor or invent a connecting door. Upper and lower levels share the building entrance.</text></g></svg>