<text x="390" y="690" font-size="22">The upper apartment</text><text x="390" y="725" font-size="18">A small room with rich furnishings; no chairs or stools</text><path d="M65 850H1335" stroke="#b8a17b"/><text x="65" y="890" font-size="16">The host’s country house is near Ashby. It is temporary accommodation for Isaac, Rebecca and their retinue.</text><text x="65" y="918" font-size="16">Room shape, scale, orientation, stair position and the furniture arrangement are reconstructed. The low platform is seating, not another storey.</text><text x="65" y="946" font-size="16">The source establishes a stair descent, but provides no measured footprint for either level.</text></g></svg>