<text x="80" y="1135" font-size="19">Private stair from the prison-side rooms above · gallery · folding doors · hall</text><path d="M65 1210H1585" stroke="#b9a57e"/><text x="65" y="1248" font-size="16">The private stair descends to a long gallery; folding doors open into the great hall. The dais is raised above the lower public floor.</text><text x="65" y="1276" font-size="16">The Master’s seat is highest; four preceptors sit lower and set back, with knights and esquires below. Two scribes sit at a table at the Master’s feet.</text><text x="65" y="1304" font-size="16">Geometry, orientation, seat positions and dimensions are reconstructed. This is the lower of two known relative levels, not a claimed ground-storey number.</text></g></svg>