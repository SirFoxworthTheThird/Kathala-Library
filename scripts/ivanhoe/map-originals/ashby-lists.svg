<text x="1208" y="1160" font-size="16">Archers, bottom access</text><path d="M65 1270H1535" stroke="#bea780"/><text x="65" y="1305" font-size="16">Source proportions govern the enclosure. Gallery sizes, relief strokes, trees and approach shapes are interpretive; no surveyed heights are claimed.</text><text x="65" y="1332" font-size="16">The separate detail panels preserve unknown positions. The borrowed pavilion is not identified with a challenger’s tent or a particular end.</text><text x="65" y="1359" font-size="16">No occupant, winner or concealed identity is encoded in the drawing. The archery detail has no exact measured distance or compass bearing.</text></g></svg>