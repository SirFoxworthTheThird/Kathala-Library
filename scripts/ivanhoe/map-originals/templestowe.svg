<text x="110" y="1165" font-size="21">Fair meadows and pastures</text><path d="M65 1260H1735" stroke="#b9a57e"/><text x="65" y="1298" font-size="16">The garden is inside the fortifications; a drawbridge guards the gate. The adjoining tiltyard occupies levelled ground on a gentle rise.</text><text x="65" y="1326" font-size="16">Footprint, garden beds, plant species, paths, compass orientation and building positions are reconstructed. The bridge gap’s depth and water condition are unstated.</text><text x="65" y="1354" font-size="16">The dashed internal-position panel records an unspecified place in the house. Drawn spacing is not a measured distance or a claim that a private room has been identified.</text></g></svg>