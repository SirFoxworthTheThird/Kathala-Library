<text x="700" y="510" text-anchor="middle" font-size="26">Upper round apartment</text><text x="700" y="555" text-anchor="middle" font-size="21">Immediately above the gathering room</text>
<path d="M480 650h150m140 0h150" stroke="#9d7f55" stroke-width="30"/><text x="700" y="725" text-anchor="middle" font-size="19">Work and gathering places · reconstructed</text>
<path d="M390 390q-70 100-20 165" fill="none" stroke="#816d4e" stroke-width="14"/><text x="120" y="245" font-size="21">Winding stair from the third storey</text><path d="M65 995H1385" stroke="#b8a17b"/><text x="65" y="1035" font-size="16">A winding stair ascends to the round apartment immediately above the gathering room. The source establishes this relative floor explicitly.</text><text x="65" y="1065" font-size="16">The six-buttress envelope follows the keep’s described form; internal work positions, furniture, windows and exact stair junction are reconstructed.</text><text x="65" y="1095" font-size="16">The circle represents the source-described room; its diameter is not supplied as a measured survey.</text></g></svg>