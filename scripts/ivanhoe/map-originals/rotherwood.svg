 <text x="646" y="263" font-size="24">The hall</text>
 <text x="783" y="541" font-size="21">Sleeping cells</text>
 <text x="1039" y="291" font-size="20">Raised rooms</text>
 <text x="1015" y="501" font-size="17">Seven oak steps</text>
