<path d="M260 537 291 481M1000 607 1067 632M1120 710 1150 735" fill="none" stroke="#5d6247" stroke-width="1.5" stroke-dasharray="4 4"/>
<g font-family="Georgia,serif" fill="#514a39" font-size="17">
 <text x="67" y="775">Interpretive site plan · not to scale. The western entrance, water-filled ditch and two defensive banks follow II.68–70.</text>
 <text x="67" y="808">Building positions, enclosure shape and internal circulation are reconstructed; no surveyed floor plan survives in the text.</text>
 <text x="67" y="841">*The postern and two-plank crossing follow VI.49–61; their compass position is unknown. This drawing suggests no secret passage.</text>
 <text x="67" y="874">The household is low and irregular, not a Norman turreted castle. The southern sleeping cell is mentioned at VI.4.</text>
</g>
</svg>
