<text x="65" y="62" font-family="Georgia,serif" font-size="36" fill="#302e24">Rotherwood · the household and its defences</text>
<text x="67" y="99" font-family="Georgia,serif" font-size="18" fill="#554f3c">Low timber buildings, several courts, a stream-fed ditch and two palisades · Chapters II and VI</text>
