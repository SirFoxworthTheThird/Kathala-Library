<text x="725" y="780" text-anchor="middle" font-size="18">Use the parent ground plan for the threshold and raft.</text><path d="M65 860H1385" stroke="#b9a57e"/><text x="65" y="898" font-size="16">The defenders work the projecting stone above the two attackers. The raft and gate threshold are lower positions, not this parapet.</text><text x="65" y="926" font-size="16">Parapet length, shape, pinnacle design and height are reconstructed. The source does not establish a floor number or an exact stair location.</text><text x="65" y="954" font-size="16">The downward guide indicates relative elevation only; no ladder, corridor, stair or passable escape route is invented.</text></g></svg>