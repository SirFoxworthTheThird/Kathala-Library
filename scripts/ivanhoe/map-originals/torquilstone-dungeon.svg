<text x="485" y="665" font-size="22">Damp pavement below moat level</text><path d="M65 910H1385" stroke="#b9a57e"/><text x="65" y="948" font-size="16">The floor is below ground and even below the moat. High loop-holes admit little light; a stair and locked door provide the narrated entrance.</text><text x="65" y="976" font-size="16">Fire-grate, transverse bars and old fetters follow the first description. No fire, torture or injury is asserted by this initial plan.</text><text x="65" y="1004" font-size="16">Dimensions, stair side, grate placement, light direction and chain positions are reconstructed. This room is not placed at court level.</text></g></svg>