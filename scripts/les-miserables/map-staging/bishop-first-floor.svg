<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><rect width="1400" height="1000" fill="#eee3ce"/><rect x="25" y="25" width="1350" height="950" rx="9" fill="#faf4e6" stroke="#9c8667" stroke-width="3"/><g font-family="Georgia, serif"><text x="700" y="78" text-anchor="middle" font-size="38" fill="#40382c">The Bishop’s House — First Floor</text><text x="700" y="114" text-anchor="middle" font-size="20" fill="#756954">The women’s chambers and the room where linen hangs</text>
  <rect x="140" y="320" width="365" height="350" fill="#f4e9d6" stroke="#655744" stroke-width="6"/><text x="322.5" y="490" text-anchor="middle" font-size="26" fill="#40382c">Baptistine’s chamber</text><text x="322.5" y="525" text-anchor="middle" font-size="19" fill="#746550">The large bergère stays upstairs</text>
  <rect x="505" y="320" width="390" height="350" fill="#f4e9d6" stroke="#655744" stroke-width="6"/><text x="700" y="490" text-anchor="middle" font-size="26" fill="#40382c">Drawing room</text><text x="700" y="525" text-anchor="middle" font-size="19" fill="#746550">Linen hung here; evening prayers</text>
  <rect x="895" y="320" width="365" height="350" fill="#f4e9d6" stroke="#655744" stroke-width="6"/><text x="1077.5" y="490" text-anchor="middle" font-size="26" fill="#40382c">Magloire’s chamber</text><text x="1077.5" y="525" text-anchor="middle" font-size="19" fill="#746550">A private room above the bishop</text>
  <text x="700" y="240" text-anchor="middle" font-size="29" fill="#40382c">Three upper rooms</text>
  <text x="700" y="746" text-anchor="middle" font-size="24" fill="#40382c">The women retire to their own chambers after praying in the drawing room.</text>
  <text x="700" y="795" text-anchor="middle" font-size="23" fill="#756954">The source does not specify the room order or stair position.</text>
  <text x="700" y="842" text-anchor="middle" font-size="20" fill="#756954">Rooms are arranged side by side here for clarity; no connecting doors are inferred.</text>
<text x="700" y="939" text-anchor="middle" font-size="20" fill="#756954">Editorial schematic • not measured • no cardinal orientation is asserted</text></g></svg>
